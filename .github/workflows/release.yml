name: Release

on:
  push:
    branches: [fog_release]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements/dev.txt
      - run: python -m invoke pack
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" releases/*.zip --title "Build ${{ github.run_number }}" --notes "${{ github.event.head_commit.message }}" --target "${{ github.sha }}"
